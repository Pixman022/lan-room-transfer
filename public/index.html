<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff8f3" />
  <title>LAN Room — 文件互传</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="app-shell topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>LAN Room</span></div>
      <div class="top-status"><span class="prototype-chip">技术原型</span><span class="connection-status" id="connection-status">未连接</span></div>
    </div>
  </header>
  <main class="app-shell">
    <section id="home-screen" class="home-screen">
      <div class="home-intro">
        <h1>轻松分享文件</h1>
      </div>
      <div class="panel entry-panel">
        <div class="entry-avatar">
          <div class="avatar avatar-lg" id="home-device-avatar" aria-hidden="true">🐾</div>
        </div>
        <div class="entry-device">
          <div class="device-name-line">
            <strong id="home-device-label" class="device-name-text">—</strong>
            <button id="edit-home-device-name" class="edit-name-button" type="button" aria-label="修改设备名称" aria-controls="home-device-label" title="修改设备名称">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4z"/></svg>
            </button>
          </div>
          <span class="entry-device-chip">当前设备</span>
        </div>
        <div class="entry-room-code">
          <label for="room-code-input">房间号</label>
          <div class="room-code-editor">
            <input id="room-code-input" maxlength="16" autocomplete="off" spellcheck="false" aria-label="房间号" placeholder="1234 / HOME2026" />
            <button id="regenerate-code" class="secondary" type="button" title="更换随机码" aria-label="更换随机码">↻</button>
          </div>
        </div>
        <button id="enter-room" class="primary wide" type="button" aria-busy="false"><span id="entry-loading-icon" class="entry-loading-spinner" aria-hidden="true" hidden></span><span id="entry-button-label">进入房间</span><span id="entry-button-arrow" aria-hidden="true">→</span></button>
      </div>
    </section>

    <section id="room-screen" hidden>
      <div class="room-heading">
        <div class="room-heading-copy">
          <p class="tiny-label">房间</p>
          <div class="room-title-line">
            <h1 id="room-name">—</h1>
            <button id="copy-code" class="copy-room-code" type="button" aria-label="复制房间号" title="复制房间号">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2"/>
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="room-actions">
          <button id="leave-room" class="quiet-button" type="button">退出</button>
        </div>
      </div>
      <div class="identity-strip">
        <div class="identity-main">
          <span class="avatar avatar-lg" id="my-device-avatar" aria-hidden="true">🐾</span>
          <div class="identity-copy"><span class="tiny-label">我的设备</span>
            <div class="device-name-line">
              <strong id="my-device-label" class="device-name-text">—</strong>
              <button id="edit-device-name" class="edit-name-button" type="button" aria-label="修改设备名称" aria-controls="my-device-label" title="修改设备名称">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <section id="qa-panel" class="panel qa-panel" hidden>
        <div class="section-heading"><h2>并发验收 · 同步接收</h2><span class="muted small">仅 QA 模式</span></div>
        <p class="muted small">A、B、C 分别选择本机要接收的文件并点击“准备接收”。全部准备好后，只在 A 点击一次“同步开始”。传输仍通过原有 P2P 安全验证。</p>
        <label for="qa-file">本机将接收的文件</label>
        <select id="qa-file" aria-label="选择本机准备接收的文件"></select>
        <div class="qa-actions">
          <button id="qa-arm" class="secondary small-button" type="button">准备接收</button>
          <button id="qa-start" class="primary small-button" type="button">同步开始（只在 A 点击）</button>
          <button id="qa-cancel" class="quiet-button small-button" type="button">取消准备</button>
        </div>
        <p id="qa-status" class="muted small" role="status" aria-live="polite">请选择文件后准备，三台设备均准备完成再统一开始。</p>
      </section>

      <div class="room-grid">
        <section class="panel peer-panel">
          <div class="section-heading"><h2>在线设备</h2><div class="section-tools"><span class="muted small" id="device-count">0 台</span><button class="text-button" id="qa-enable" type="button" aria-controls="qa-panel" aria-expanded="false">并发验收</button><button class="text-button" id="toggle-diagnostics" type="button" aria-expanded="false" aria-controls="diagnostics-panel">诊断</button></div></div>
          <div class="device-list" id="peer-list"></div>
          <div class="diagnostics-panel" id="diagnostics-panel" hidden>
            <div class="diagnostics-content" id="diagnostics-content"></div>
            <button class="quiet-button small-button" id="copy-diagnostics" type="button">复制诊断</button>
          </div>
          <input id="send-files" type="file" multiple hidden aria-label="选择要发送的文件" />
        </section>
        <div class="stack room-right">
          <section class="panel upload-panel">
            <div class="section-heading"><h2>上传文件</h2></div>
            <button class="drop-zone" id="drop-zone" type="button">
              <span class="drop-symbol" aria-hidden="true">↑</span>
              <strong>拖放文件到这里</strong>
              <span class="drop-detail">或点击选择</span>
            </button>
            <div class="sent-files" id="sent-files" hidden></div>
          </section>
          <section class="panel">
            <div class="section-heading"><h2>房间文件</h2><span class="muted small" id="request-count">0 个</span></div>
            <div id="incoming-requests" class="request-list"><p class="empty">暂无文件</p></div>
          </section>
        </div>
      </div>

    </section>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <p class="prototype-note" role="note">实验性大文件传输 · 无固定文件大小上限，受浏览器内存限制 · P2P 直传，不保证仅经过局域网</p>
  </main>
</body>
</html>
